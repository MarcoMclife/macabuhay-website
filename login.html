<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family login — Macabuhay</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f1e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100svh; }
  .login-photo { position: relative; background: var(--g-dark); overflow: hidden; }
  .login-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .login-side { display: flex; flex-direction: column; padding: 32px var(--gut); }
  .login-top { display: flex; justify-content: space-between; align-items: center; }
  .login-top .script { font-size: 40px; }
  .login-form { width: 100%; max-width: 400px; margin: auto; padding: 48px 0; display: flex; flex-direction: column; gap: 20px; }
  .login-form h1 { font-size: clamp(36px, 2vw + 20px, 52px); }
  .login-form .intro { color: var(--muted); font-size: 16px; margin-top: -8px; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; }
  .reset { background: none; border: 0; padding: 0; cursor: pointer; font-size: 14px; }
  .divider { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .btn-social { gap: 12px; background: var(--g-card); }
  .btn-social svg { width: 18px; height: 18px; flex: none; }
  .login-foot { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  @media (max-width: 860px) {
    .login { grid-template-columns: 1fr; }
    .login-photo { height: 28svh; min-height: 180px; }
    .login-form { padding: 32px 0; }
  }
</style>
</head>
<body>
<div class="login">
  <div class="login-photo" aria-hidden="true">
    <!-- STAND-IN: replace with a family photograph -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg/1280px-Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg"
         srcset="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg/960px-Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg 960w,
                 https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg/1920px-Lake_Pandin%2C_San_Pablo%2C_Laguna.jpg 1920w"
         sizes="(max-width: 860px) 100vw, 50vw" alt="">
  </div>

  <main class="login-side">
    <div class="login-top">
      <a class="brand" href="index.html" aria-label="Macabuhay home"><span class="script">Macabuhay</span></a>
      <a class="link" href="index.html">Back to home</a>
    </div>

    <div class="login-form">
      <div>
        <span class="label label--gold">Family portal</span>
      </div>
      <h1>Welcome <em>home</em></h1>
      <p class="intro">Sign in to see family photos, profiles and events. New members are approved by a family admin.</p>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>

      <div class="field">
        <label for="email">Email address</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <div class="row-between">
          <label for="password">Password</label>
          <button type="button" class="link link--action reset" onclick="resetPassword()">Forgot password?</button>
        </div>
        <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button id="btn-email" class="btn btn--primary btn--block" type="button" onclick="signInEmail()">Sign in</button>

      <div class="divider">or continue with</div>

      <button id="btn-google" class="btn btn--secondary btn--block btn-social" type="button" onclick="signInGoogle()">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </button>
      <button id="btn-microsoft" class="btn btn--secondary btn--block btn-social" type="button" onclick="signInMicrosoft()">
        <svg viewBox="0 0 23 23" aria-hidden="true"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg>
        Sign in with Microsoft
      </button>
    </div>

    <div class="login-foot">
      <span>© 2026 The Macabuhay Family</span>
      <span>Private family site · invitation only</span>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDFm6zKz-GFfwN2ctWoEsCjTpir7B22scI",
    authDomain: "macabuhay-website.firebaseapp.com",
    projectId: "macabuhay-website",
    storageBucket: "macabuhay-website.firebasestorage.app",
    messagingSenderId: "464926995204",
    appId: "1:464926995204:web:a3f4c16900fa77edee9651"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function setLoading(loading) {
    ['btn-email','btn-google','btn-microsoft'].forEach(function(id) {
      document.getElementById(id).disabled = loading;
    });
  }

  function handleUser(user) {
    showMsg('Checking access…', 'info');
    var ref = db.collection('users').doc(user.uid);
    ref.get().then(function(snap) {
      if (!snap.exists) {
        ref.set({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || '',
          photoURL: user.photoURL || '',
          role: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
          showMsg('Your request has been sent. A family admin will approve your access soon.', 'pending');
          setLoading(false);
        }).catch(function(e) {
          console.log("Error creating record:", e);
          showMsg('Error: ' + e.message, 'error');
          setLoading(false);
        });
        return;
      }
      var data = snap.data();
      if (data.role === 'pending') {
        showMsg('Your access request is waiting for approval.', 'pending');
        setLoading(false);
      } else if (data.role === 'denied') {
        showMsg('Your access was not approved. Please contact a family admin.', 'error');
        setLoading(false);
      } else if (data.role === 'admin') {
        showMsg('Welcome back — opening the admin dashboard…', 'success');
        setTimeout(function() { window.location.href = 'admin.html'; }, 500);
      } else if (data.role === 'member') {
        showMsg('Welcome back — opening the family portal…', 'success');
        setTimeout(function() { window.location.href = 'family.html'; }, 500);
      } else {
        showMsg('Unknown role: ' + data.role, 'error');
        setLoading(false);
      }
    }).catch(function(e) {
      console.log("Firestore error:", e.code, e.message);
      showMsg('Database error: ' + e.code + ' - ' + e.message, 'error');
      setLoading(false);
    });
  }

  // Listen for auth state
  auth.onAuthStateChanged(function(user) {
    if (user) {
      handleUser(user);
    }
  });

  function signInEmail() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) { showMsg('Please enter your email and password.', 'error'); return; }
    setLoading(true);
    auth.signInWithEmailAndPassword(email, password)
      .then(function(result) { handleUser(result.user); })
      .catch(function(e) {
        var msgs = {
          'auth/user-not-found': 'No account found with this email.',
          'auth/wrong-password': 'Incorrect password.',
          'auth/invalid-email': 'Please enter a valid email address.',
          'auth/too-many-requests': 'Too many attempts. Please try again later.',
          'auth/invalid-credential': 'Invalid email or password.'
        };
        showMsg(msgs[e.code] || 'Sign in failed. Please try again.', 'error');
        setLoading(false);
      });
  }

  function resetPassword() {
    var email = document.getElementById('email').value.trim();
    if (!email) { showMsg('Enter your email address above, then tap “Forgot password?” again.', 'info'); document.getElementById('email').focus(); return; }
    auth.sendPasswordResetEmail(email)
      .then(function() { showMsg('If an account exists for ' + email + ', a reset link is on its way.', 'success'); })
      .catch(function(e) {
        showMsg(e.code === 'auth/invalid-email' ? 'Please enter a valid email address.' : 'Could not send the reset email. Please try again.', 'error');
      });
  }

  function signInGoogle() {
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showMsg('Google sign-in failed: ' + e.message, 'error');
      }
    });
  }

  function signInMicrosoft() {
    var provider = new firebase.auth.OAuthProvider('microsoft.com');
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).catch(function(e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showMsg('Microsoft sign-in failed: ' + e.message, 'error');
      }
    });
  }

  ['email', 'password'].forEach(function(id) {
    document.getElementById(id).addEventListener('keydown', function(e) {
      if (e.key === 'Enter') signInEmail();
    });
  });
</script>
</body>
</html>
